[pytest]
addopts = -ra --strict-markers -p no:cacheprovider
testpaths = apps/backend/tests infra/tests
pythonpath = apps/backend/src apps/backend
norecursedirs = .* .venv venv node_modules framework
markers =
    contract: validates an adapter against a fixed external interface
    integration: uses local runtime data, Docker, or the fixed harness
