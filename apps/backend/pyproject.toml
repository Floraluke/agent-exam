[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentexam-backend"
version = "0.1.0"
description = "AgentExam modular backend and M0 evaluation prototype"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pyarrow==23.0.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "psycopg[binary]==3.3.5",
  "argon2-cffi==25.1.0",
  "boto3==1.43.93",
]

[project.scripts]
agentexam-owner = "eval_platform.delivery.owner:main"
agentexam-jobs = "eval_platform.delivery.jobs:main"
agentexam-worker = "eval_platform.delivery.worker.runtime:main"

[dependency-groups]
dev = [
  "anyio==4.14.2",
  "httpx2==2.13.0",
  "mypy==1.18.2",
  "pip-audit==2.10.1",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff==0.15.17",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eval_platform.adapters.tasks" = ["collect_patch.sh"]
"eval_platform.adapters.persistence" = ["identity.sql", "membership.sql"]
"eval_platform.adapters.persistence.catalog" = ["schema.sql"]
"eval_platform.adapters.persistence.jobs" = ["schema.sql"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider --cov --cov-report=term-missing"
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
  "contract: validates an adapter against a fixed external interface",
  "integration: uses local runtime data, Docker, or the fixed harness",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["src"]
files = ["src/eval_platform"]

[tool.coverage.run]
branch = true
# The default gate covers the in-process product core. PostgreSQL adapters remain
# behind their explicit integration tier instead of making the unit gate depend on
# a running database.
source = [
  "eval_platform.domain",
  "eval_platform.application",
  "eval_platform.delivery",
  "eval_platform.adapters.artifacts",
  "eval_platform.adapters.tasks",
  "eval_platform.adapters.execution",
  "eval_platform.adapters.evaluation",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
